<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Password Strength Analyzer</h1>

        <p>Check how strong your password is!</p>

        <div class="input-box">
            <input type="password" id="password"
            placeholder="Enter your password">

            <button onclick="togglePassword()" id="toggle">
                Show
            </button>
        </div>

        <div class="progress">
            <div id="progress-bar"></div>
        </div>

        <h3 id="strength">Password Strength</h3>

        <div class="checks">
            <p id="length"> At least 12 characters</p>
            <p id="upper"> Uppercase letter</p>
            <p id="lower"> Lowercase letter</p>
            <p id="number"> Number</p>
            <p id="special"> Special character</p>
            <p id="unique"> No repeated characters</p>
        </div>

        <div class="suggestion">
            <h3>Suggested Strong Password</h3>
            <p id="suggestion">Your suggestion will appear here.</p>
            <button onclick="generatePassword()">
                Generate Password
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
